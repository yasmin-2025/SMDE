<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMDE | Notifications</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="./css/app-shared.css">

    <link rel="stylesheet" href="./css/notifications.css">
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <div id="sidebarMount" data-active="notifications"></div>


    <!-- MAIN -->
    <main class="main-content">
        <section class="content-area">

            <div class="page-intro-row mb-4">

                <div>
                    <span class="section-label">ALERTS CENTER</span>
                    <h1 class="h3">System Notifications</h1>
                    <p class="intro-text">
                        Stay on top of machine alerts and system events.
                    </p>
                </div>

                <button id="markAllReadBtn" class="btn btn-outline-light">
                    <i class="bi bi-check2-all me-2"></i>
                    Mark all as read
                </button>

            </div>


            <div class="glass-card">

                <div class="notif-tabs mb-3">

                    <button class="notif-tab active" data-filter="all">
                        All
                    </button>

                    <button class="notif-tab" data-filter="unread">
                        Unread
                    </button>

                    <button class="notif-tab" data-filter="high">
                        Critical
                    </button>

                </div>

                <div id="notificationsList">
                    <!-- rendered by notifications.js -->
                </div>

                <div id="emptyNotifications" class="empty-notif d-none">
                    <i class="bi bi-bell-slash"></i>
                    <p>No notifications here.</p>
                </div>

            </div>

        </section>

    </main>

</div>

<script src="./js/app-layout.js"></script>
<script src="./js/animations.js"></script>

<script src="./js/notifications.js"></script>

</body>
</html>
