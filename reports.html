
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMDE | Reports</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Shared CSS -->
    <link rel="stylesheet" href="./css/app-shared.css">

    <!-- Reports CSS -->
    <link rel="stylesheet" href="./css/reports.css">

</head>


<body>

<div class="app-container">


    <!-- ================= SIDEBAR ================= -->

    <div
        id="sidebarMount"
        data-active="reports">
    </div>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">
        <!-- ================= CONTENT ================= -->

        <section class="content-area">


            <!-- ================= PAGE INTRO ================= -->

            <div class="page-intro-row mb-4">

                <div>

                    <span class="section-label">
                        INSIGHTS
                    </span>

                    <h1 class="h3">
                        Failure & Prediction Reports
                    </h1>

                    <p class="intro-text">
                        A summary view of prediction activity
                        and machine risk trends.
                    </p>

                </div>


                <button
                    class="btn btn-outline-light"
                    onclick="window.print()">

                    <i class="bi bi-printer me-2"></i>

                    Print / Export

                </button>

            </div>


            <!-- ================= SUMMARY ================= -->

            <div class="row g-3 mb-4">


                <!-- TOTAL -->

                <div class="col-12 col-md-3">

                    <div class="stat-card">

                        <div class="stat-icon blue">

                            <i class="bi bi-activity"></i>

                        </div>

                        <div>

                            <small>
                                Total Predictions
                            </small>

                            <h3 id="totalPredictions">
                                0
                            </h3>

                        </div>

                    </div>

                </div>


                <!-- AVERAGE RISK -->

                <div class="col-12 col-md-3">

                    <div class="stat-card">

                        <div class="stat-icon orange">

                            <i class="bi bi-percent"></i>

                        </div>

                        <div>

                            <small>
                                Average Risk
                            </small>

                            <h3 id="averageRisk">
                                0%
                            </h3>

                        </div>

                    </div>

                </div>


                <!-- MOST AT RISK -->

                <div class="col-12 col-md-3">

                    <div class="stat-card">

                        <div class="stat-icon red">

                            <i class="bi bi-exclamation-octagon"></i>

                        </div>

                        <div>

                            <small>
                                Most At-Risk
                            </small>

                            <h3 id="mostAtRisk">
                                —
                            </h3>

                        </div>

                    </div>

                </div>


                <!-- NORMAL -->

                <div class="col-12 col-md-3">

                    <div class="stat-card">

                        <div class="stat-icon green">

                            <i class="bi bi-shield-check"></i>

                        </div>

                        <div>

                            <small>
                                Normal Results
                            </small>

                            <h3 id="normalPercentage">
                                0%
                            </h3>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ================= CHARTS ================= -->

            <div class="row g-4 mb-4">


                <!-- TREND -->

                <div class="col-lg-7">

                    <div class="glass-card h-100">

                        <div class="card-title-row mb-3">

                            <div>

                                <span class="section-label">
                                    TREND
                                </span>

                                <h4>
                                    Average Failure Probability
                                </h4>

                            </div>

                        </div>


                        <div class="chart-box">

                            <canvas id="trendChart"></canvas>

                        </div>

                    </div>

                </div>


                <!-- RISK -->

                <div class="col-lg-5">

                    <div class="glass-card h-100">

                        <div class="card-title-row mb-3">

                            <div>

                                <span class="section-label">
                                    DISTRIBUTION
                                </span>

                                <h4>
                                    Risk Level Breakdown
                                </h4>

                            </div>

                        </div>


                        <div class="chart-box">

                            <canvas id="riskChart"></canvas>

                        </div>

                    </div>

                </div>

            </div>


            <!-- ================= MACHINE CHART ================= -->

            <div class="row g-4">


                <div class="col-lg-12">

                    <div class="glass-card">

                        <div class="card-title-row mb-3">

                            <div>

                                <span class="section-label">
                                    BY MACHINE
                                </span>

                                <h4>
                                    Predictions per Machine
                                </h4>

                            </div>

                        </div>


                        <div class="chart-box">

                            <canvas id="machineChart"></canvas>

                        </div>

                    </div>

                </div>

            </div>


        </section>

    </main>

</div>


<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Chart.js -->

<script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js">
</script>


<!-- Shared JS -->

<script src="./js/app-layout.js"></script>

<script src="./js/animations.js"></script>


<!-- Reports JS -->

<script src="./js/reports.js"></script>


</body>

</html>
